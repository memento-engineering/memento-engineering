name: memento_engineering_tool
description: >-
  The org register's CI check. Not a published package and not part of the
  register — it exists only so a clean checkout can lint docs/decisions with
  the same engine the station composes.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.11.0

dependencies:
  decisions:
    git:
      url: https://github.com/memento-engineering/decisions.git
      path: cli/dart/decisions
      ref: decisions-v0.2.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.26.3
